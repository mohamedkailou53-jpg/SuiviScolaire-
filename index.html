<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#27432d">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<title>SuiviScolaire — Lycée d'Excellence de Tessaoua</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&family=Roboto:wght@300;400;500;700&family=Poppins:wght@300;400;500;600;700&family=Montserrat:wght@300;400;500;600;700&family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root {
  --primary:   #5a6b3e;
  --primary2:  #6e8249;
  --primary-pale: #f1f4ec;
  --accent:    #8b7355;
  --accent-pale: #f5f0e8;
  --bg:        #f7f8f4;
  --white:     #ffffff;
  --border:    #dde3d5;
  --text:      #2c3322;
  --text2:     #5a6650;
  --rouge:     #c0392b;
  --bleu-wa:   #25D366;
  --gold:      #c8952a;
  --sidebar-w: 252px;
  --font:      'Inter', sans-serif;
  --radius:    10px;
  --fs:        14px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{font-size:var(--fs);}
body{font-family:var(--font);font-size:1rem;background:var(--bg);color:var(--text);min-height:100vh;transition:background 0.3s,color 0.3s,font-size 0.2s;}
body.dark{--bg:#181e12;--white:#212918;--border:#323d26;--text:#e5edda;--text2:#92a87a;--primary-pale:#28301e;--accent-pale:#2a2820;}

/* LAYOUT */
.layout{display:flex;min-height:100vh;}
.sidebar{width:var(--sidebar-w);background:var(--primary);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;transition:background 0.3s;}
.sidebar-logo{padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,0.1);}
.logo-school{font-size:0.63rem;color:rgba(255,255,255,0.5);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:3px;line-height:1.3;}
.logo-title{font-family:'Playfair Display',serif;color:#fff;font-size:1.2rem;line-height:1.2;}
.logo-sub{color:rgba(255,255,255,0.45);font-size:0.63rem;margin-top:3px;letter-spacing:0.08em;text-transform:uppercase;}
.sidebar-nav{padding:10px 0;flex:1;overflow-y:auto;}
.nav-group{padding:9px 14px 3px;color:rgba(255,255,255,0.35);font-size:0.6rem;letter-spacing:0.12em;text-transform:uppercase;font-weight:700;}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 16px;color:rgba(255,255,255,0.7);font-size:0.83rem;cursor:pointer;transition:all 0.15s;border-left:3px solid transparent;}
.nav-item:hover{background:rgba(255,255,255,0.08);color:#fff;}
.nav-item.active{background:rgba(255,255,255,0.14);color:#fff;border-left-color:var(--gold);font-weight:600;}
.nav-icon{font-size:0.95rem;width:19px;text-align:center;flex-shrink:0;}
.sidebar-footer{padding:11px 16px;border-top:1px solid rgba(255,255,255,0.1);}
.sidebar-date{color:rgba(255,255,255,0.55);font-size:0.7rem;line-height:1.5;}
.sidebar-annee{color:rgba(255,255,255,0.35);font-size:0.62rem;margin-top:2px;}

/* MAIN */
.main{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;}
.topbar{background:var(--white);border-bottom:1px solid var(--border);padding:13px 26px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;transition:background 0.3s,border-color 0.3s;}
.topbar-left{display:flex;flex-direction:column;}
.topbar-title{font-size:1rem;font-weight:700;color:var(--text);}
.topbar-date{font-size:0.72rem;color:var(--text2);margin-top:1px;}
.topbar-right{display:flex;align-items:center;gap:9px;}
.badge-mois{background:var(--accent-pale);color:var(--accent);border:1px solid #ddd0b8;font-size:0.73rem;font-weight:600;padding:3px 11px;border-radius:20px;}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:0.8rem;font-weight:700;}
.content{padding:26px;flex:1;}

/* PAGES */
.page{display:none;}.page.active{display:block;}

/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:22px;}
.stat-card{background:var(--white);border-radius:var(--radius);padding:17px;border:1px solid var(--border);position:relative;overflow:hidden;transition:background 0.3s,border-color 0.3s;}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--primary);}
.stat-card.or::before{background:var(--gold);}
.stat-card.rouge::before{background:var(--rouge);}
.stat-card.bleu::before{background:#2980b9;}
.stat-label{font-size:0.68rem;color:var(--text2);text-transform:uppercase;letter-spacing:0.07em;font-weight:700;margin-bottom:6px;}
.stat-value{font-size:1.85rem;font-weight:700;color:var(--text);line-height:1;}
.stat-sub{font-size:0.7rem;color:var(--text2);margin-top:5px;}

/* CARD */
.card{background:var(--white);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;margin-bottom:18px;transition:background 0.3s,border-color 0.3s;}
.card-header{padding:15px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.card-title{font-size:0.88rem;font-weight:700;color:var(--text);display:flex;align-items:center;gap:7px;}
.card-body{padding:18px 20px;}

/* BUTTONS */
.btn{padding:7px 15px;border-radius:8px;font-size:0.8rem;font-weight:600;cursor:pointer;border:none;transition:all 0.15s;display:inline-flex;align-items:center;gap:5px;font-family:var(--font);}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary2);transform:translateY(-1px);box-shadow:0 3px 10px rgba(74,94,58,0.22);}
.btn-accent{background:var(--accent);color:#fff;}
.btn-accent:hover{background:#7a6347;transform:translateY(-1px);}
.btn-wa{background:var(--bleu-wa);color:#fff;}
.btn-wa:hover{background:#1db954;transform:translateY(-1px);box-shadow:0 4px 12px rgba(37,211,102,0.28);}
.btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--text2);}
.btn-outline:hover{border-color:var(--primary);color:var(--primary);}
.btn-danger{background:#c0392b;color:#fff;}
.btn-sm{padding:5px 10px;font-size:0.73rem;}
.btn:disabled{opacity:0.42;cursor:not-allowed;transform:none!important;}

/* TABLE */
table{width:100%;border-collapse:collapse;}
th{background:var(--primary-pale);padding:9px 13px;text-align:left;font-size:0.68rem;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:0.06em;border-bottom:1px solid var(--border);}
td{padding:10px 13px;font-size:0.83rem;border-bottom:1px solid var(--border);vertical-align:middle;color:var(--text);}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--primary-pale);}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:0.68rem;font-weight:700;}
.badge-green{background:#e8f5ee;color:#1a6b3c;}
.badge-or{background:#fdf5e6;color:#c8952a;}
.badge-red{background:#fdecea;color:#c0392b;}
.badge-blue{background:#e8f0fe;color:#1a73e8;}
.badge-kaki{background:var(--primary-pale);color:var(--primary);}

/* CLASS TABS */
.class-tabs{display:flex;gap:7px;margin-bottom:18px;flex-wrap:wrap;}
.class-tab{padding:6px 16px;border-radius:8px;font-size:0.8rem;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:var(--white);color:var(--text2);transition:all 0.15s;}
.class-tab.active{background:var(--primary);color:#fff;border-color:var(--primary);}

/* MATIÈRES GRID */
.matieres-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px;}
.matiere-card{background:var(--white);border:1.5px solid var(--border);border-radius:var(--radius);padding:13px 15px;cursor:pointer;transition:all 0.15s;display:flex;align-items:center;gap:11px;}
.matiere-card:hover{border-color:var(--primary);background:var(--primary-pale);transform:translateY(-2px);box-shadow:0 4px 12px rgba(74,94,58,0.1);}
.matiere-card.has-notes{border-color:var(--primary);}
.matiere-card.selected{border-color:var(--primary);background:var(--primary-pale);box-shadow:0 0 0 3px rgba(90,107,62,0.14);}
.mat-icon-wrap{width:36px;height:36px;border-radius:8px;background:var(--primary-pale);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:1.15rem;}
.matiere-name{font-size:0.81rem;font-weight:600;color:var(--text);}
.matiere-coeff{font-size:0.68rem;color:var(--text2);margin-top:1px;}

/* NOTE PANEL */
.note-panel{background:var(--white);border-radius:var(--radius);border:1.5px solid var(--primary);padding:20px;display:none;margin-bottom:18px;}
.note-panel.visible{display:block;}
.note-panel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.note-panel-title{font-size:0.92rem;font-weight:700;color:var(--primary);display:flex;align-items:center;gap:7px;}
.eleve-note-row{padding:11px 0;border-bottom:1px solid var(--border);}
.eleve-note-row:last-child{border-bottom:none;}
.eleve-note-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;}
.eleve-note-name{font-size:0.86rem;font-weight:700;}
.notes-list{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:7px;min-height:10px;}
.note-chip{display:flex;align-items:center;gap:5px;background:var(--primary-pale);border:1px solid var(--border);border-radius:20px;padding:3px 9px 3px 11px;font-size:0.78rem;font-weight:600;}
.note-chip-val{color:var(--primary);}
.note-chip-del{background:none;border:none;cursor:pointer;color:var(--rouge);font-size:0.83rem;line-height:1;padding:0 2px;font-weight:700;}
.note-chip-del:hover{opacity:0.7;}
.add-note-row{display:flex;align-items:center;gap:7px;}
.note-input{width:76px;padding:6px 9px;border:1.5px solid var(--border);border-radius:8px;font-size:0.86rem;font-weight:600;text-align:center;font-family:var(--font);color:var(--text);background:var(--white);transition:border-color 0.15s;}
.note-input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(90,107,62,0.1);}
.note-sur{font-size:0.76rem;color:var(--text2);}

/* WELCOME */
.welcome-banner{background:linear-gradient(135deg,var(--primary) 0%,#6e8249 100%);border-radius:13px;padding:22px 26px;color:#fff;margin-bottom:22px;position:relative;overflow:hidden;}
.welcome-banner::after{content:'🏫';position:absolute;right:22px;top:50%;transform:translateY(-50%);font-size:4.2rem;opacity:0.11;}
.welcome-school{font-size:0.68rem;opacity:0.7;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:3px;}
.welcome-title{font-family:'Playfair Display',serif;font-size:1.38rem;margin-bottom:4px;}
.welcome-sub{opacity:0.75;font-size:0.83rem;}

/* PODIUM */
.podium-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.podium-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:13px 15px;text-align:center;transition:background 0.3s;}
.podium-card.p1{border-color:#c8952a;background:linear-gradient(135deg,#fffbf0,#fff8e6);}
.podium-card.p2{border-color:#9e9e9e;background:linear-gradient(135deg,#f9f9f9,#f0f0f0);}
.podium-card.p3{border-color:#a0785a;background:linear-gradient(135deg,#fff8f5,#fdf0ea);}
.podium-medal{font-size:1.5rem;margin-bottom:4px;}
.podium-name{font-size:0.8rem;font-weight:700;color:var(--text);margin-bottom:2px;}
.podium-classe{font-size:0.68rem;color:var(--text2);margin-bottom:4px;}
.podium-moy{font-size:1.05rem;font-weight:700;color:var(--primary);}

/* BULLETIN */
.bulletin-preview{background:var(--white);border:2px solid var(--primary);border-radius:12px;overflow:hidden;margin-bottom:22px;}
.bulletin-header{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;padding:16px 22px;display:flex;align-items:flex-start;justify-content:space-between;}
.bulletin-school{font-size:0.65rem;opacity:0.7;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:3px;}
.bulletin-eleve-name{font-family:'Playfair Display',serif;font-size:1.25rem;}
.bulletin-meta{font-size:0.76rem;opacity:0.76;margin-top:3px;}
.bulletin-badge{background:var(--gold);color:#fff;padding:4px 12px;border-radius:20px;font-size:0.73rem;font-weight:700;white-space:nowrap;}
.bulletin-body{padding:18px 22px;}
.bulletin-footer{border-top:1px solid var(--border);padding:13px 22px;display:flex;align-items:center;justify-content:space-between;background:var(--primary-pale);}
.moyenne-val{font-size:1.65rem;font-weight:700;color:var(--primary);}
.moyenne-label{font-size:0.73rem;color:var(--text2);}
.note-cell{font-weight:700;font-size:0.92rem;}
.note-good{color:#1a6b3c;}.note-avg{color:#c8952a;}.note-bad{color:#c0392b;}

/* ENVOI */
.envoi-card{background:var(--white);border-radius:var(--radius);border:1px solid var(--border);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;transition:all 0.15s;}
.envoi-card:hover{box-shadow:0 3px 10px rgba(0,0,0,0.05);}
.envoi-name{font-weight:700;font-size:0.88rem;color:var(--text);}
.envoi-parent{font-size:0.76rem;color:var(--text2);margin-top:2px;}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.42);z-index:200;align-items:center;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{background:var(--white);border-radius:13px;width:480px;max-width:95vw;box-shadow:0 20px 60px rgba(0,0,0,0.17);overflow:hidden;animation:slideUp 0.22s ease;}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.modal-header{padding:17px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.modal-title{font-size:0.92rem;font-weight:700;color:var(--text);}
.modal-close{cursor:pointer;color:var(--text2);font-size:1.05rem;background:none;border:none;width:27px;height:27px;display:flex;align-items:center;justify-content:center;border-radius:6px;}
.modal-close:hover{background:var(--bg);}
.modal-body{padding:20px;}
.modal-footer{padding:13px 20px;border-top:1px solid var(--border);display:flex;gap:7px;justify-content:flex-end;}

/* FORM */
.form-group{margin-bottom:13px;}
.form-label{display:block;font-size:0.73rem;font-weight:700;color:var(--text2);margin-bottom:5px;text-transform:uppercase;letter-spacing:0.05em;}
.form-input,.form-select{width:100%;padding:8px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:0.83rem;font-family:var(--font);color:var(--text);background:var(--white);transition:border-color 0.15s;}
.form-input:focus,.form-select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(90,107,62,0.1);}

/* SETTINGS */
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.setting-item{margin-bottom:17px;}
.setting-label{font-size:0.78rem;font-weight:700;color:var(--text2);margin-bottom:7px;text-transform:uppercase;letter-spacing:0.06em;display:block;}
.color-swatches{display:flex;gap:8px;flex-wrap:wrap;}
.swatch{width:27px;height:27px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all 0.15s;flex-shrink:0;}
.swatch.active{border-color:var(--text);transform:scale(1.15);}
.font-options{display:flex;gap:7px;flex-wrap:wrap;}
.font-opt{padding:5px 13px;border:1.5px solid var(--border);border-radius:8px;font-size:0.78rem;cursor:pointer;color:var(--text2);background:var(--white);transition:all 0.15s;}
.font-opt.active{border-color:var(--primary);color:var(--primary);font-weight:600;}
.size-slider{width:100%;accent-color:var(--primary);}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);}
.toggle-row:last-child{border-bottom:none;}
.toggle{position:relative;width:40px;height:22px;}
.toggle input{opacity:0;width:0;height:0;}
.toggle-slider{position:absolute;inset:0;background:#ccc;border-radius:22px;cursor:pointer;transition:0.25s;}
.toggle-slider::before{content:'';position:absolute;width:16px;height:16px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:0.25s;}
.toggle input:checked+.toggle-slider{background:var(--primary);}
.toggle input:checked+.toggle-slider::before{transform:translateX(18px);}

/* TOAST */
.toast-container{position:fixed;bottom:20px;right:20px;z-index:999;display:flex;flex-direction:column;gap:7px;}
.toast{background:var(--text);color:#fff;padding:10px 16px;border-radius:9px;font-size:0.82rem;box-shadow:0 4px 18px rgba(0,0,0,0.17);animation:slideIn 0.25s ease;display:flex;align-items:center;gap:7px;max-width:300px;}
.toast.success{background:var(--primary);}
.toast.warning{background:var(--gold);}
@keyframes slideIn{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:translateX(0)}}

/* MISC */
.empty-state{text-align:center;padding:38px 22px;color:var(--text2);}
.empty-icon{font-size:2.6rem;margin-bottom:9px;}
.empty-text{font-size:0.84rem;}
.divider{height:1px;background:var(--border);margin:13px 0;}
.tag{display:inline-block;padding:2px 7px;background:var(--primary-pale);color:var(--primary);border-radius:4px;font-size:0.68rem;font-weight:700;}
.section-label{font-size:0.7rem;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:9px;display:flex;align-items:center;gap:5px;}

/* SEND ALL PROGRESS */
.send-progress{background:var(--primary-pale);border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px;margin-bottom:14px;display:none;}
.send-progress.visible{display:block;}
.progress-bar-wrap{background:var(--border);border-radius:20px;height:6px;margin-top:8px;}
.progress-bar{background:var(--bleu-wa);height:6px;border-radius:20px;transition:width 0.3s;}

/* ═══ AUTHENTIFICATION ═══ */
.layout{display:none;}
.layout.app-ready{display:flex;}
#auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--primary) 0%,#3d4a2a 100%);padding:20px;}
.auth-box{background:var(--white);border-radius:16px;width:440px;max-width:100%;box-shadow:0 24px 70px rgba(0,0,0,0.35);overflow:hidden;}
.auth-head{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;padding:24px 28px;}
.auth-head-title{font-family:'Playfair Display',serif;font-size:1.4rem;}
.auth-head-sub{font-size:0.78rem;opacity:0.8;margin-top:3px;}
.auth-tabs{display:flex;border-bottom:1px solid var(--border);}
.auth-tab{flex:1;text-align:center;padding:13px;font-size:0.83rem;font-weight:700;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;}
.auth-tab.active{color:var(--primary);border-bottom-color:var(--primary);background:var(--primary-pale);}
.auth-body{padding:24px 28px;}
.auth-panel{display:none;}
.auth-panel.active{display:block;}
.auth-switch{font-size:0.78rem;color:var(--text2);text-align:center;margin-top:14px;}
.auth-switch a{color:var(--primary);font-weight:700;cursor:pointer;text-decoration:none;}
.auth-error{background:#fdecea;color:#c0392b;border:1px solid #f3c6c1;border-radius:8px;padding:9px 12px;font-size:0.8rem;margin-bottom:13px;display:none;}
.auth-error.visible{display:block;}
.btn-block{width:100%;justify-content:center;padding:10px;}
.topbar-user{display:flex;align-items:center;gap:9px;}
.topbar-user-info{text-align:right;}
.topbar-user-name{font-size:0.78rem;font-weight:700;color:var(--text);}
.topbar-user-role{font-size:0.68rem;color:var(--text2);}
.prof-access-table{width:100%;border-collapse:collapse;}
.prof-access-table td{padding:6px 4px;vertical-align:middle;}
.prof-access-row-input{width:120px;padding:5px 8px;border:1.5px solid var(--border);border-radius:6px;font-size:0.78rem;font-family:var(--font);}
</style>
</head>
<body>

<!-- ÉCRAN D'AUTHENTIFICATION -->
<div id="auth-screen">
  <div class="auth-box">
    <div class="auth-head">
      <div class="auth-head-title">🏫 SuiviScolaire</div>
      <div class="auth-head-sub">Connexion à votre espace</div>
    </div>
    <div class="auth-tabs">
      <div class="auth-tab active" id="tab-admi
